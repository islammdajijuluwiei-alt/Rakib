 return tabs+C.map((c,ci)=>`<div class="box"><div class="row"><b>${esc(c.name)}</b><button class="btn s r" data-dc="${ci}">মুছুন</button></div><input data-c="${ci}" data-f="name" value="${esc(c.name)}" placeholder="নাম"><input data-c="${ci}" data-f="tag" value="${esc(c.tag)}" placeholder="ক্যাটাগরি ট্যাগ"><input data-c="${ci}" data-f="img" value="${esc(c.img)}" placeholder="ছবির URL"><select data-c="${ci}" data-f="sec"><option value="special" ${c.sec==="special"?"selected":""}>Special Offer</option><option value="topup" ${c.sec!=="special"?"selected":""}>Free Fire Top-Up</option></select>${c.items.map((x,ii)=>`<div class="row" style="flex-wrap:nowrap"><input data-c="${ci}" data-i="${ii}" data-f="n" value="${esc(x.n)}"><input style="width:90px" type="number" data-c="${ci}" data-i="${ii}" data-f="p" value="${x.p}"><button class="btn s r" data-di="${ci}-${ii}">✕</button></div>`).join("")}<button class="btn s o" data-ai="${ci}">+ আইটেম</button></div>`).join("")+`<button class="btn o" id="ac">+ নতুন প্যাকেজ/ক্যাটাগরি</button><button class="btn" id="sc">সব সংরক্ষণ</button>`}
function bindAdmin(){const R=()=>route();
 if($("#al"))$("#al").onclick=async()=>{try{if(FB)await fauth.signInWithEmailAndPassword($("#ae").value,$("#ap").value);else if($("#ap").value!==ADMIN_PIN)throw Error("ভুল PIN");adm=true;R()}catch(e){toast(e.message)}};
 if($("#lo"))$("#lo").onclick=()=>{adm=false;FB&&fauth.signOut();R()};
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{atab=b.dataset.t;R()});
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const id=b.dataset.id,n=$("#n-"+id).value;await dupd("orders/"+id,{status:b.dataset.a,note:n,doneAt:Date.now()});toast("আপডেট হয়েছে");R()});
 if($("#ss"))$("#ss").onclick=async()=>{const s={};document.querySelectorAll("[data-k]").forEach(i=>s[i.dataset.k]=i.value.trim());s.banners=$("#bn").value.split("\n").map(x=>x.trim()).filter(Boolean);await dset("settings",s);S={...S,...s};toast("সংরক্ষিত");$("#logo").innerHTML=S.logo?`<img src="${esc(S.logo)}">`:esc(S.siteName)};
 document.querySelectorAll("[data-c]").forEach(i=>i.onchange=()=>{const c=C[i.dataset.c];if(i.dataset.i!==undefined){c.items[i.dataset.i][i.dataset.f]=i.dataset.f==="p"?Number(i.value):i.value}else c[i.dataset.f]=i.value});
 document.querySelectorAll("[data-ai]").forEach(b=>b.onclick=()=>{C[b.dataset.ai].items.push({n:"নতুন আইটেম",p:0,o:false});R()});
 document.querySelectorAll("[data-di]").forEach(b=>b.onclick=()=>{const[a,i]=b.dataset.di.split("-");C[a].items.splice(i,1);R()});
 document.querySelectorAll("[data-dc]").forEach(b=>b.onclick=()=>{if(confirm("মুছবেন?")){C.splice(b.dataset.dc,1);R()}});
 if($("#ac"))$("#ac").onclick=()=>{C.push({id:"p"+Date.now().toString(36),name:"নতুন প্যাকেজ",tag:"নতুন",tc:"#15803d",sec:"topup",em:"🎮",ti:"NEW",img:"",items:[]});R()};
 if($("#sc"))$("#sc").onclick=async()=>{await dset("catalog",C);toast("সব প্যাকেজ সংরক্ষিত")}}
/* ===== ROUTER ===== */
async function route(){const h=location.hash.slice(1)||"home",a=$("#app");if(!U&&!(h==="admin"&&!FB)){document.body.classList.add("out");a.innerHTML=authView(authMode);bindAuth();return}document.body.classList.remove("out");
 if(h.startsWith("c-")){const c=C.find(x=>x.id===h.slice(2));a.innerHTML=cat(h.slice(2));if(c)bindCat(c)}
 else if(h==="orders")a.innerHTML=await orders();
 else if(h==="add"){a.innerHTML=add();bindAdd()}
 else if(h==="wallet")a.innerHTML=await wallet();
 else if(h==="profile"){a.innerHTML=await profile();$("#lg").onclick=logout}
 else if(h==="admin"){a.innerHTML=await admin();bindAdmin()}
 else a.innerHTML=home();
 document.querySelectorAll("nav a").forEach(x=>x.classList.toggle("on",x.dataset.r===(h.startsWith("c-")?"home":h)));
 $("#bal").textContent="৳ "+await balance();$("#adm").style.display=isAdm()?"":"none";$("#av").textContent=U?(U.name[0]||"U").toUpperCase():"G";window.scrollTo(0,0)}
addEventListener("hashchange",route);init();
